name: Publish VALOWISH Release
on:
  push:
    branches: [main]
    paths:
      - release.json
      - CHANGELOG-v*.md
      - assets/**
      - index.html
      - .github/workflows/publish-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: valowish-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
      - name: Read release configuration
        id: meta
        shell: bash
        run: |
          python3 - <<'PYMETA' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('release.json', encoding='utf-8'))
          version=str(d['version']).strip()
          status=str(d['status']).strip()
          notes=str(d['changelog']).strip()
          if not version.isdigit() or status not in {'Stable','Experimental','Unstable','Beta','Alpha','Release Candidate'}:
              raise SystemExit('Invalid release.json version or status')
          print(f'tag={version}')
          print(f'title=v{version} {status}')
          print(f'notes={notes}')
          print(f'prerelease={str(status != "Stable").lower()}')
          PYMETA
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          NOTES: ${{ steps.meta.outputs.notes }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          test -f "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES"
          fi
